{% extends "base.html" %}

{% block title %}Dashboard - EPCRAS{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <div class="card shadow-sm border-0 bg-white p-4">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold text-dark mb-1">Welcome, {{ current_user.username }}</h3>
                    <p class="text-muted mb-0">Role: <span class="badge bg-primary fs-7">{{ current_user.role }}</span> | System Status: Active</p>
                </div>
                <div class="text-end">
                    <span class="badge bg-success p-2"><i class="bi bi-check-circle-fill me-1"></i> Authenticated</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-primary text-white p-3">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="text-uppercase mb-1 opacity-75">IT Assets</h6>
                    <h2 class="fw-bold mb-0">0</h2>
                </div>
                <i class="bi bi-pc-display fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-info text-white p-3">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="text-uppercase mb-1 opacity-75">Software Catalog</h6>
                    <h2 class="fw-bold mb-0">0</h2>
                </div>
                <i class="bi bi-app-indicator fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-warning text-dark p-3">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="text-uppercase mb-1 opacity-75">Active CVEs</h6>
                    <h2 class="fw-bold mb-0">0</h2>
                </div>
                <i class="bi bi-bug-fill fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
</div>
{% endblock %}
